# nginx site config for hiriketiyanoahsurfschool.com
# Install to: /etc/nginx/sites-available/hiriketiyanoahsurfschool.com.conf
# Next.js frontend on 127.0.0.1:3000, Express API on 127.0.0.1:5000

# --- Restore real visitor IPs (traffic arrives from Cloudflare) ---
# Cloudflare IPv4 ranges (https://www.cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare IPv6 ranges (https://www.cloudflare.com/ips-v6)
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream surfsite_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream surfsite_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name hiriketiyanoahsurfschool.com www.hiriketiyanoahsurfschool.com;
    return 301 https://hiriketiyanoahsurfschool.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hiriketiyanoahsurfschool.com www.hiriketiyanoahsurfschool.com;

    # Cloudflare Origin CA certificate (SSL/TLS mode: Full (strict))
    ssl_certificate     /etc/ssl/cloudflare/hiriketiyanoahsurfschool.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/hiriketiyanoahsurfschool.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Redirect www -> apex on HTTPS too
    if ($host = www.hiriketiyanoahsurfschool.com) {
        return 301 https://hiriketiyanoahsurfschool.com$request_uri;
    }

    # Uploads via multer (API limits JSON to 2mb; images can be bigger)
    client_max_body_size 15m;

    # --- Security headers (helmet covers /api/*; these cover the Next.js app) ---
    # NOTE: nginx drops server-level add_header in any location that declares its
    # own add_header — those locations repeat these lines.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ── Express API ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://surfsite_api;
    }

    location /uploads/ {
        proxy_pass http://surfsite_api;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /health {
        proxy_pass http://surfsite_api;
        access_log off;
    }

    # ── Next.js static assets (long cache, immutable hashes) ─
    location /_next/static/ {
        proxy_pass http://surfsite_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── Next.js app ──────────────────────────────────────────
    location / {
        proxy_pass http://surfsite_web;
    }
}
